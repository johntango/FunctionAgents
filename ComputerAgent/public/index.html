<!DOCTYPE html>
<html data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Managing Assistants MIT Mark 1</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style src="styles.css"></style>

    <script>
      // Centralized state with versioning
      let state = {
        version: 0,
        agent: false,
        chat_response: true,
        assistant_id: "",
        assistant_name: "",
        dir_path: "",
        news_path: "",
        thread_id: "",
        user_message: "",
        run_id: "",
        run_status: "",
        vector_store_name: "",
        vector_store_id: "",
        tools: [],
        mcp_tools: [],
        parameters: [],
      };

      // Apply updates to both state and corresponding DOM elements
      function updateState(updates) {
        Object.assign(state, updates);
        for (const [key, val] of Object.entries(updates)) {
          const el = document.getElementById(key);
          if (el) el.value = val;
        }
      }

      // Read only the fields we care about into state
      function get_data_from_elements() {
        const keys = [
          "agent",
          "chat_response",
          "assistant_id",
          "assistant_name",
          "dir_path",
          "news_path",
          "thread_id",
          "user_message",
          "run_id",
          "run_status",
          "vector_store_name",
          "vector_store_id",
          "tools",
          "mcp_tools",
          "parameters",
        ];
        const updates = {};
        for (const key of keys) {
          const el = document.getElementById(key);
          if (el) updates[key] = el.value;
        }
        updateState(updates);
      }

      // Render AI/chat responses
      function write_to_div(route, message) {
        const responseDiv = document.getElementById("response");
        if (!responseDiv) return;
        if (!Array.isArray(message)) {
          responseDiv.innerHTML = JSON.stringify(message);
          return;
        }
        responseDiv.innerHTML = "";
        message.forEach((item) => {
          const span = document.createElement("span");
          span.textContent =
            item.content ?? JSON.stringify(item.function ?? item);
          span.style.color =
            {
              user: "yellow",
              assistant: "white",
              system: "red",
              function: "turquoise",
            }[item.role] || "magenta";
          responseDiv.appendChild(span);
          responseDiv.appendChild(document.createElement("br"));
        });
      }

      // Unified request sender with state-delta + version
      async function sendRequest(action) {
        get_data_from_elements();
        const target = document.getElementById("target_selection").value;
        const route = `/api/${target}/${action}`;
        const res = await fetch(route, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(state),
          mode: "cors",
        });
        const { message, stateDelta, version } = await res.json();
        if (version > state.version) {
          updateState({ ...stateDelta, version });
        }
        write_to_div(route, message);
      }

      // Combined prompt + run
      async function sendPromptAndRun() {
        await sendRequest("prompt");
        await sendRequest("run");
      }

      // Show/hide assistant vs agent panels
      function toggleTargetPanels() {
        const sel = document.getElementById("target_selection").value;
        document.getElementById("assistant-buttons").style.display =
          sel === "assistant" ? "block" : "none";
        document.getElementById("agent-buttons").style.display =
          sel === "agent" ? "block" : "none";
      }

      // Show/hide tool panels and update state.tools
      function toggleToolButtons() {
        const webCb = document.getElementById("tool_web_search");
        const ragCb = document.getElementById("tool_rag_system");
        const compCb = document.getElementById("tool_computer_use");

        document.getElementById("web-search-buttons").style.display =
          webCb.checked ? "block" : "none";
        document.getElementById("rag-buttons").style.display = ragCb.checked
          ? "block"
          : "none";
        document.getElementById("computer-use-buttons").style.display =
          compCb.checked ? "block" : "none";

        const filesearch = {
          type: "file_search",
          vector_store_ids: [`${state.vector_store_id}`],
        };
        const websearch = { type: "web_search_preview" };
        const compuse = {
          type: "computer_use_preview",
          display_width: 1024,
          display_height: 768,
          environment: "browser",
        };

        const newTools = [];
        if (webCb.checked) newTools.push(websearch);
        if (ragCb.checked) newTools.push(filesearch);
        if (compCb.checked) newTools.push(compuse);

        updateState({ tools: newTools });
      }

      // Initialize on load
      document.addEventListener("DOMContentLoaded", () => {
        document
          .getElementById("target_selection")
          .addEventListener("change", toggleTargetPanels);
        toggleTargetPanels();
        toggleToolButtons();
      });
    </script>
  </head>
  <body>
    <div class="card">
      <div class="card-body">
        <!-- Header -->
        <section class="part2 mb-4">
          <div class="container">
            <div class="row align-items-center" style="width: 70%">
              <div class="col-sm-2">
                <img src="bridge.png" alt="" width="70" height="50" />
              </div>
              <div class="col">
                <h4>MIT Agent Function Caller</h4>
              </div>
            </div>
          </div>
        </section>

        <!-- Target dropdown -->
        <div class="row mb-3">
          <div class="col">
            <label for="target_selection" class="form-label">Send to:</label>
            <select id="target_selection" class="form-select">
              <option value="chat_response">Chat_response</option>
              <option value="assistant">Assistant</option>
              <option value="agent">Agent</option>
            </select>
          </div>
        </div>

        <!-- Tool checkboxes -->
        <div class="row mb-3">
          <div class="col">
            <label class="form-label">Enable Tools:</label>
            <div class="form-check">
              <input
                id="tool_web_search"
                class="form-check-input"
                type="checkbox"
                onchange="toggleToolButtons()"
              />
              <label class="form-check-label" for="tool_web_search"
                >Web Search</label
              >
            </div>
            <div class="form-check">
              <input
                id="tool_rag_system"
                class="form-check-input"
                type="checkbox"
                onchange="toggleToolButtons()"
              />
              <label class="form-check-label" for="tool_rag_system"
                >RAG System</label
              >
            </div>
            <div class="form-check">
              <input
                id="tool_computer_use"
                class="form-check-input"
                type="checkbox"
                onchange="toggleToolButtons()"
              />
              <label class="form-check-label" for="tool_computer_use"
                >Computer Use</label
              >
            </div>
          </div>
        </div>

        <!-- Web Search panel -->
        <div id="web-search-buttons" style="display: none" class="mb-3">
          <button class="btn btn-primary" onclick="sendRequest('search_web')">
            Search Web
          </button>
        </div>

        <!-- RAG System panel -->
        <div id="rag-buttons" style="display: none" class="mb-3">
          <div class="row mb-2">
            <div class="col">
              <button
                class="btn btn-primary"
                onclick="sendRequest('get_vector_store')"
              >
                Get Vector Knowledge Base
              </button>
            </div>
            <div class="col">
              <input
                id="vector_store_name"
                class="form-control"
                placeholder="Vector Store Name"
              />
            </div>
          </div>
          <div class="row">
            <div class="col">
              <button
                class="btn btn-primary"
                onclick="sendRequest('create_vector_store')"
              >
                Create KB from Directory
              </button>
            </div>
            <div class="col">
              <input
                id="dir_path"
                class="form-control"
                placeholder="Directory Path"
              />
            </div>
          </div>
        </div>

        <!-- Computer Use panel -->
        <div id="computer-use-buttons" style="display: none" class="mb-3">
          <button class="btn btn-primary" onclick="sendRequest('run_code')">
            Run Code
          </button>
        </div>

        <!-- Permanent Prompt + Run -->
        <div class="row mb-4">
          <div class="col-2">
            <button class="btn btn-success" onclick="sendPromptAndRun()">
              Send & Run
            </button>
          </div>
          <div class="col-8">
            <input
              id="user_message"
              class="form-control"
              placeholder="Enter your prompt…"
            />
          </div>
        </div>

        <!-- Assistant-only controls -->
        <div id="assistant-buttons" style="display: none">
          <!-- ... existing assistant controls ... -->
        </div>

        <!-- Agent-only controls -->
        <div id="agent-buttons" style="display: none">
          <!-- ... existing agent controls ... -->
        </div>

        <!-- Output panels -->
        <div class="mt-4">
          <label>Agent Context Window:</label>
          <div
            id="response"
            class="border p-3 mb-3"
            style="height: 200px; overflow: auto"
          ></div>

          <label>JSON Output:</label>
          <div
            id="json_output"
            class="border p-3 mb-3"
            style="height: 200px; overflow: auto"
          ></div>

          <label>Functions:</label>
          <div
            id="functions"
            class="border p-3"
            style="height: 200px; overflow: auto"
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
